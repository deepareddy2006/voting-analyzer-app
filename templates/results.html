<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voting Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container results-page">
        <h1>Voting Results</h1>
        <h2>Highest Votes: {{ highest_votes_name }} ({{ highest_votes_count }})</h2>

        <!-- Interactive pie chart -->
        <div>
            {{ chart_html | safe }}
        </div>

        <!-- Table -->
        <h3>All Candidates Votes</h3>
        <table>
            <thead>
                <tr>
                    <th>Candidate</th>
                    <th>Votes</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{ row.Candidate }}</td>
                    <td>{{ row.Votes }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('upload_file') }}" class="btn back">Upload Another CSV</a>
        <a href="{{ url_for('index') }}" class="btn home">Back to Home</a>
    </div>
</body>
</html>
