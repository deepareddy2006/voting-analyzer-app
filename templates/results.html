<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="title">Voting Results</h1>
        <h3 class="subtitle">Candidates with Highest Votes: {{ top_candidates | join(', ') }} ({{ highest_votes }} votes)</h3>
        <img src="{{ url_for('static', filename=chart) }}" alt="Vote Chart" class="chart">
        <table>
            <thead>
                <tr>
                    <th>Candidate</th>
                    <th>Votes</th>
                </tr>
            </thead>
            <tbody>
                {% for candidate, votes in data.items() %}
                <tr>
                    <td>{{ candidate }}</td>
                    <td>{{ votes }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{{ url_for('upload_file') }}" class="btn btn-primary mt-3">Upload Another CSV</a>
        <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Back to Home</a>
    </div>
</body>
</html>
